[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llvm-ir"
version = "0.1.0"
description = "Utilities for building LLVM IR function-level datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
compiler-gym = ["compiler_gym"]
dev = ["pytest>=8.0"]

[project.scripts]
llvm-ir-build-dataset = "llvm_ir.stages.dataset.builder:main"
llvm-ir-pass-search = "llvm_ir.stages.function_search.pass_search:main"
llvm-ir-build-order-graphs = "llvm_ir.stages.translation_unit.graph.order_graph:main"
llvm-ir-run-tu-heuristics = "llvm_ir.stages.translation_unit.path_heuristics:main"
llvm-ir-eval-tu-heuristics = "llvm_ir.stages.translation_unit.evaluate:main"
llvm-ir-run-aggregation = "llvm_ir.scripts.run_aggregation:main"
llvm-ir-export-aggregation-paths = "llvm_ir.heuristics.aggregation.export_paths:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
